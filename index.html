<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>S Pen Notes Canvas</title>
  <link rel="stylesheet" href="style.css">
  <!-- PeerJS для надежного Cloud P2P WebRTC соединения без проброса портов -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
  <!-- Главный бесконечный холст для S Pen -->
  <canvas id="noteCanvas"></canvas>

  <!-- Верхняя информационная панель -->
  <header class="top-bar">
    <div class="status-pill" id="statusPill" title="Статус P2P соединения">
      <span class="status-dot disconnected" id="statusDot"></span>
      <span class="status-text" id="statusText">Поиск Obsidian...</span>
    </div>

    <div class="top-actions">
      <button class="icon-btn" id="btnZoomReset" title="Сбросить масштаб">100%</button>
      <button class="icon-btn" id="btnUndo" title="Отменить действие (Undo)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
      </button>
      <button class="icon-btn" id="btnRedo" title="Повторить действие (Redo)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/></svg>
      </button>
      <button class="icon-btn danger" id="btnClear" title="Очистить весь холст">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
      </button>
    </div>
  </header>

  <!-- Индикатор режима / уведомление (Hold-to-Straighten, Отправка итд) -->
  <div class="toast" id="toast"></div>

  <!-- Плавающий минималистичный тулбар заметок (стиль современных Dark Notes) -->
  <nav class="floating-toolbar">
    <!-- Инструменты пера -->
    <div class="tool-group tools-segment">
      <button class="tool-btn active" data-tool="pen" title="Перо (S Pen Ink)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19 7-7 3 3-7 7-3-3z"/><path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="m2 2 7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
      </button>
      <button class="tool-btn" data-tool="highlighter" title="Маркер / Хайлайтер">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 11-6 6v3h3l6-6"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>
      </button>
      <button class="tool-btn" data-tool="eraser" title="Ластик">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
      </button>
    </div>

    <div class="toolbar-divider"></div>

    <!-- Палитра цветов -->
    <div class="tool-group colors-segment" id="paletteColors">
      <button class="color-dot active" data-color="#ffffff" style="--c: #ffffff" title="Белый"></button>
      <button class="color-dot" data-color="#94a3b8" style="--c: #94a3b8" title="Серебристый"></button>
      <button class="color-dot" data-color="#fef08a" style="--c: #fef08a" title="Желтый"></button>
      <button class="color-dot" data-color="#86efac" style="--c: #86efac" title="Мятный"></button>
      <button class="color-dot" data-color="#7dd3fc" style="--c: #7dd3fc" title="Голубой"></button>
      <button class="color-dot" data-color="#f472b6" style="--c: #f472b6" title="Розовый"></button>
    </div>

    <div class="toolbar-divider"></div>

    <!-- Выбор толщины -->
    <div class="tool-group size-segment" id="sizeSelector">
      <button class="size-btn" data-size="2" title="Тонкая линия (2px)">
        <span class="size-circle" style="width: 4px; height: 4px;"></span>
      </button>
      <button class="size-btn active" data-size="4" title="Средняя линия (4px)">
        <span class="size-circle" style="width: 7px; height: 7px;"></span>
      </button>
      <button class="size-btn" data-size="8" title="Широкая линия (8px)">
        <span class="size-circle" style="width: 11px; height: 11px;"></span>
      </button>
    </div>

    <div class="toolbar-divider"></div>

    <!-- Кнопка отправки в Obsidian -->
    <button class="send-btn" id="btnSend" title="Обрезать и отправить в активную заметку Obsidian">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
      <span>Отправить</span>
    </button>
  </nav>

  <!-- Модальное окно настройки подключения (если QR код не передал параметры) -->
  <div class="modal-overlay" id="connectModal">
    <div class="modal-card">
      <h3>Подключение к Obsidian</h3>
      <p>Отсканируйте QR-код в Obsidian на компьютере (команда <code>/spen</code> или значок на панели).</p>
      <div class="input-group">
        <label>Или введите ID пира вручную:</label>
        <input type="text" id="inputPeerId" placeholder="например: obsidian-spen-12345">
      </div>
      <div class="modal-buttons">
        <button class="btn secondary" id="btnCancelModal">Закрыть</button>
        <button class="btn primary" id="btnManualConnect">Подключить</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
